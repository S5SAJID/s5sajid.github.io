media:
  input: public/
  output: /
content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: category
        label: Category
        type: string
      - name: date
        label: Date
        type: date
        required: true
      - name: readTime
        label: Read Time
        type: string
      - name: draft
        label: Draft
        type: boolean
        default: true
      - name: lastModified
        label: Last Modified
        type: date
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Body
        type: rich-text
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: string
      - name: description
        label: Description
        type: text
        required: true
      - name: skills
        label: Skills
        type: string
        list: true
      - name: livePreviewURL
        label: Live Preview URL
        type: string
      - name: caseStudyEnabled
        label: Case Study Enabled
        type: boolean
      - name: imagePreviewURL
        label: Image Preview URL
        type: image
      - name: draft
        label: Draft
        type: boolean
        default: true
      - name: featured
        label: Featured
        type: boolean
      - name: body
        label: Body
        type: rich-text
  - name: legalPk
    label: Pakistan legal documents
    type: collection
    path: src/content/legal-pk
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: version
        label: Document version
        type: string
        required: true
      - name: status
        label: Status
        type: select
        options:
          values: [example, active, archived]
        required: true
      - name: updatedDate
        label: Last updated (YYYY-MM-DD)
        type: string
        required: true
      - name: effectiveDate
        label: Effective date (required for active documents, YYYY-MM-DD)
        type: string
      - name: draft
        label: Draft (exclude from published site)
        type: boolean
        default: true
      - name: order
        label: Display order
        type: number
        default: 0
      - name: body
        label: Body
        type: rich-text
